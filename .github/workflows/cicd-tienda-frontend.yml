name: CI/CD Tienda Perritos - Frontend

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"

jobs:
  build-push-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v3

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build imagen Frontend y push a ECR
        run: |
          cd frontend
          docker build -t tienda-frontend .
          docker tag tienda-frontend:latest ${{ secrets.ECR_REPO_URL_FRONTEND }}:eks-v1
          docker push ${{ secrets.ECR_REPO_URL_FRONTEND }}:eks-v1

      - name: Deploy a EKS via kubectl
        run: |
          aws eks update-kubeconfig --name devopseks --region ${{ secrets.AWS_REGION }}
          kubectl rollout restart deployment/tienda-frontend -n tienda
          kubectl rollout status deployment/tienda-frontend -n tienda --timeout=120s
